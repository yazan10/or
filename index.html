    <script>
      // Ignore harmless Vite HMR WebSocket connection errors in sandbox (per environment constraint)
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.includes('WebSocket') || e.message.includes('createWebSocketModuleRunnerTransport') || (e.filename && e.filename.includes('@vite/client')))) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        var str = String(e.reason || '');
        if (str.includes('WebSocket') || str.includes('@vite/client') || str.includes('createWebSocketModuleRunnerTransport')) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
    </script>
